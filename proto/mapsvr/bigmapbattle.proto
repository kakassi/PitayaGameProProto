syntax = "proto3";

package mapsvr;
option go_package = "pitaya-game/protos/protobuf/pb/golang/mapsvr";

// 导入公共类型
import "common/types/types.proto";
import "common/errors/errors.proto";


message BattleRequest {

}


// 
message FighterInfo {
  string  player_id = 1;  //name ?
  int32   x = 2;        // X坐标
  int32   y = 3;        // Y坐标
  int32   soldier_count = 4;
  int32   death_count = 5;
  int32   live_count = 6;
}


message BattleResponse {
  types.CommonResp resp = 1;

  FighterInfo attacker = 2;
  FighterInfo defencer = 3;

}

enum TroopType {
  TROOP_TYPE_UNSPECIFIED = 0;
  INFANTRY = 1; // 步兵
  CAVALRY  = 2; // 骑兵
  ARCHER   = 3; // 弓兵
}

message TroopLevels {
  map<int32, int32> level_counts = 1;
}


message StartMarchRequest {
  int32  x = 1;   // X坐标
  int32  y = 2;   // Y坐标
  int32  from_x = 3;  //临时加的出发坐标 未来这个值应该从服务器读取
  int32  from_y = 4;
  map<int32, TroopLevels> troops = 5;

}

message StartMarchResponse {
  types.CommonResp resp = 1;
  int32 march_duration  = 2;   //行军所需时长（秒）
}


message MarchBattleNotify {
  bool is_win = 1; // 是否胜利
  FighterInfo attacker = 2;
  FighterInfo defencer = 3;
}

//未来需要扩展
enum MarchType {
  MARCH_TYPE_UNSPECIFIED = 0;
  MarchTypeGo = 1; // 出征
  MarchTypeReturn  = 2; // 回城 
}

// 
message MarchInfo {
  int64  march_id = 1;       //唯一id
  string player_id = 2;  //name 
  int32  to_x = 3;   // X坐标
  int32  to_y = 4;   // Y坐标
  int32  from_x = 5;  //
  int32  from_y = 6;
  int32  march_duration = 7;   //行军所需时长（秒）
  int64  start_at = 8;
  int64  arrive_at = 9;
  MarchType march_type = 10;
}

message MarchAddNotify {
  repeated MarchInfo marches = 1;
}

message MarchRemoveNotify {
  int64   march_id = 1;       //唯一id
}


//全服所有march 下发 // 这边以后是否要做优化 todo
message AllMarchPush {
  repeated MarchInfo marches = 1;
}



